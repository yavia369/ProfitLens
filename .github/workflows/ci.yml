name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: profitlens
          POSTGRES_PASSWORD: profitlens
          POSTGRES_DB: profitlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U profitlens" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://profitlens:profitlens@localhost:5432/profitlens_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: profitlens
          POSTGRES_PASSWORD: profitlens
          POSTGRES_DB: profitlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U profitlens" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for the CI database and session signing only.
      DATABASE_URL: postgres://profitlens:profitlens@localhost:5432/profitlens
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      ENCRYPTION_KEYS: '{"ci":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      ENCRYPTION_ACTIVE_KID: ci
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @profitlens/web build
      - run: pnpm --filter @profitlens/web exec playwright install --with-deps chromium
      - name: Start app
        run: |
          pnpm --filter @profitlens/web start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login >/dev/null && break; sleep 1; done
      - run: pnpm --filter @profitlens/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t profitlens:ci .
      - name: Smoke-test migrate, web and worker against Postgres
        run: |
          docker network create pl
          docker run -d --name db --network pl -e POSTGRES_USER=profitlens -e POSTGRES_PASSWORD=profitlens -e POSTGRES_DB=profitlens postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U profitlens && break; sleep 1; done
          ENV="-e DATABASE_URL=postgres://profitlens:profitlens@db:5432/profitlens -e APP_URL=http://localhost:3000 -e BETTER_AUTH_SECRET=ci-only-secret-not-used-anywhere-else-0123456789 -e ENCRYPTION_KEYS={\"ci\":\"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\"} -e ENCRYPTION_ACTIVE_KID=ci"
          docker run --rm --network pl $ENV profitlens:ci migrate
          docker run -d --name worker --network pl $ENV profitlens:ci worker
          docker run -d --name web --network pl -p 3000:3000 $ENV profitlens:ci web
          for i in $(seq 1 30); do curl -sf "http://localhost:3000/api/health?strict=1" && exit 0; sleep 2; done
          docker logs web; docker logs worker; exit 1
