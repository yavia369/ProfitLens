# Self-hosted production-like stack: Postgres 16, a one-off migration, the web server and the worker, all from the
# same image (docs/DEPLOYMENT.md). Secrets come from a `.env` file next to this one (never committed):
#   BETTER_AUTH_SECRET, ENCRYPTION_KEYS, ENCRYPTION_ACTIVE_KID, POSTGRES_PASSWORD, APP_URL
# Usage: docker compose up -d --build   (then open APP_URL; put an HTTPS reverse proxy in front for real use)
x-app: &app
  image: profitlens:${APP_VERSION:-local}
  build:
    context: .
    args:
      APP_VERSION: ${APP_VERSION:-local}
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://profitlens:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/profitlens
    APP_URL: ${APP_URL:?set APP_URL}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
    ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS}
    ENCRYPTION_ACTIVE_KID: ${ENCRYPTION_ACTIVE_KID:?set ENCRYPTION_ACTIVE_KID}
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: profitlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: profitlens
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profitlens"]
      interval: 5s
      retries: 20

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  web:
    <<: *app
    command: ["web"]
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
